<!-- description: displays random joke and picture -->

{% extends 'dadjokes/base.html' %}

{% block content %}
<h1>Random Dad Jokes</h1>
<div>
    <p>"{{joke.text}}"</p>
    <p><em>by {{joke.name}} at {{joke.timestamp}}</em></p>
</div>
<div>
    <img src="{{picture.image_url}}">
    <p><em>{{picture.name}} at {{picture.timestamp}}</em></p>
</div>
{% endblock %}
