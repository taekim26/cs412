<!-- description: displays all pictures - image only -->

{% extends 'dadjokes/base.html' %}

{% block content %}
<h1>All Pictures</h1>
<div>
    {% for p in pictures %}
        <div>
            <a href="{% url 'picture' p.pk %}">
                <img src="{{p.image_url}}">
            </a>
            <p>
                <em>by {{p.name}} at {{p.timestamp}}</em>
            </p>
        </div>
    {% endfor %}
</div>
{% endblock %}
