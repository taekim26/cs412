<!-- quotes/templates/quotes/show_all.html -->

{% extends 'quotes/base.html' %}

{% block content %}
<h1>All quotes from Charles Darwin</h1>
<div>
    {% for quote in quotes %}
    <div> 
        <em>"{{ quote }}" - Charles Darwin</em>
    </div>
    {% endfor %}
</div>
<h1>All images of Charles Darwin</h1>
<div>
    {% for img in images %}
    <div>
        <img src="{{ img }}" alt="Charles Darwin">
    </div>
    {% endfor %}
</div>
{% endblock %}
