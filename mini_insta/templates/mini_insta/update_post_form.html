<!-- description: display the HTML form to update a Post object -->

{% extends 'mini_insta/base.html' %}

{% block content %}
<main class="form-page">
    <h1>Update Post</h1>

    <form action="{% url 'update_post' post.pk %}" method="POST">
        {% csrf_token %}
        <table>
            <tr>
                <td>Caption:</td>
                <td>{{form.caption}}</td>
            </tr>
        </table>

        <input type="submit" name="submit" value="Update">
    </form>
    <form action="{% url 'show_profile' post.profile.pk %}" method="GET">
        <input type="submit" value="Cancel">
    </form>

    <!-- shows current post for reference -->
    <div class="current-post">
        <h2>Current Post</h2>
        <div class="post-photos">
            {% for photo in post.get_all_photos %}
                <img src="{{photo.get_image_url}}" alt="{{post.caption}}">
            {% endfor %}
        </div>

        <div class="post-info">
            <p class="caption">
                <strong>@{{post.profile.username}}</strong>
                {{post.caption}}
            </p>
            <p class="timestamp">{{post.timestamp}}</p>
        </div>
    </div>
</main>
{% endblock %}
