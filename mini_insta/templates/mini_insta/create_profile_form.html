<!-- description: display form to create a new Profile -->

{% extends 'mini_insta/base.html' %}

{% block content %}
<main class="form-page">
    <h1>Create Profile</h1>

    <form action="{% url 'create_profile' %}" method="POST">
        {% csrf_token %}
        <h2>Account</h2>
        <table>
            {{user_form.as_table}}
        </table>

        <h2>Profile</h2>
        <table>
            <tr>
                <td>Username:</td>
                <td>{{form.username}}</td>
            </tr>
            <tr>
                <td>Display name:</td>
                <td>{{form.display_name}}</td>
            </tr>
            <tr>
                <td>Bio text:</td>
                <td>{{form.bio_text}}</td>
            </tr>
            <tr>
                <td>Profile image URL:</td>
                <td>{{form.profile_image_url}}</td>
            </tr>
        </table>
        <input type="submit" name="submit" value="Create Profile">
    </form>
    <form action="{% url 'show_all_profiles' %}" method="GET">
        <input type="submit" value="Cancel">
    </form>
</main>
{% endblock %}
